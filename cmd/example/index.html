<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A3Forge Manager</title>
<style>
:root {
  --bg: #0d0d12;
  --surface: #16161e;
  --surface2: #1e1e2a;
  --border: #2a2a38;
  --text: #d4d4d8;
  --muted: #71717a;
  --primary: #6366f1;
  --primary-hover: #4f52cc;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #f59e0b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  font-size: 14px;
}

/* Header */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
header h1 { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
header h1 span { color: var(--primary); }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0;
}
.status-dot.idle { background: var(--success); box-shadow: 0 0 6px var(--success); }
.status-dot.busy { background: var(--warning); box-shadow: 0 0 6px var(--warning); }
.status-dot.error { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
#header-status { font-size: 13px; color: var(--muted); }
#header-detail { font-size: 12px; color: var(--muted); margin-left: auto; font-family: monospace; }

/* Progress bar */
#progress-bar {
  height: 2px; background: var(--border); flex-shrink: 0; overflow: hidden;
}
#progress-fill {
  height: 100%; background: var(--primary); width: 0%;
  transition: width 0.4s ease; box-shadow: 0 0 8px var(--primary);
}

/* Layout */
.layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  flex: 1;
  overflow: hidden;
}
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 16px;
  gap: 12px;
}
.main-content {
  overflow-y: auto;
  padding: 24px;
}

/* Cards */
.card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
}
.card-title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin-bottom: 12px;
}
.section-title {
  font-size: 18px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 16px;
}

/* Form */
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 12px; color: var(--muted); font-weight: 500; }
input, textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 7px 11px;
  font-size: 13px;
  width: 100%;
  outline: none;
  transition: border-color 0.15s;
  font-family: inherit;
}
input:focus, textarea:focus { border-color: var(--primary); }
textarea { resize: vertical; min-height: 90px; font-family: monospace; font-size: 12px; }
.row { display: flex; gap: 8px; align-items: flex-end; }

/* Buttons */
button {
  padding: 7px 14px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  white-space: nowrap;
  font-family: inherit;
}
button:hover:not(:disabled) { opacity: 0.85; }
button:active:not(:disabled) { transform: scale(0.98); }
button:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-danger  { background: var(--danger);  color: #fff; }
.btn-ghost   { background: var(--border);  color: var(--text); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-full { width: 100%; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 20px; }
.tab {
  padding: 7px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
  background: none;
  border: 1px solid transparent;
  transition: all 0.15s;
}
.tab:hover { color: var(--text); }
.tab.active {
  color: #fff;
  background: var(--surface);
  border-color: var(--border);
}

/* Table */
.table-wrap { overflow-x: auto; border-radius: 6px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; padding: 9px 14px;
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.6px; color: var(--muted);
  background: var(--bg); border-bottom: 1px solid var(--border);
}
td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }

/* Tab panels */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Messages */
.msg {
  margin-top: 8px; padding: 8px 12px; border-radius: 6px; font-size: 12px;
}
.msg-ok    { background: rgba(34,197,94,0.1);  color: var(--success); border: 1px solid rgba(34,197,94,0.2); }
.msg-err   { background: rgba(239,68,68,0.1);  color: var(--danger);  border: 1px solid rgba(239,68,68,0.2); }

/* Status card */
.status-row { display: flex; align-items: center; gap: 8px; }
.status-label { font-size: 13px; font-weight: 500; }

/* Steam Guard panel */
.sg-panel {
  margin-top: 10px; padding: 12px;
  background: var(--bg); border-radius: 6px;
  border-left: 3px solid var(--warning);
}
.sg-label { font-size: 12px; color: var(--warning); margin-bottom: 8px; }

/* Config dir input in sidebar */
.dir-value {
  font-family: monospace; font-size: 11px; color: var(--muted);
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; padding: 4px 8px; margin-top: 4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Badge */
.badge {
  display: inline-block; padding: 1px 7px; border-radius: 10px;
  font-size: 11px; font-weight: 600;
}
.badge-active { background: rgba(34,197,94,0.15); color: var(--success); }

.mt-16 { margin-top: 16px; }
.gap-8 { gap: 8px; }
</style>
</head>
<body>

<header>
  <h1>A3<span>Forge</span></h1>
  <div class="status-dot idle" id="status-dot"></div>
  <span id="header-status">Idle</span>
  <span id="header-detail"></span>
</header>
<div id="progress-bar"><div id="progress-fill"></div></div>

<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">

    <!-- Status -->
    <div class="card">
      <div class="card-title">Status</div>
      <div class="status-row">
        <div class="status-label" id="status-label">Idle</div>
      </div>
      <div id="status-detail-text" style="font-size:12px;color:var(--muted);margin-top:4px;font-family:monospace;word-break:break-all;"></div>
      <div style="margin-top:8px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;">
        <div id="sidebar-progress" style="height:100%;background:var(--primary);width:0%;transition:width 0.4s;"></div>
      </div>
      <div id="progress-text" style="font-size:11px;color:var(--muted);margin-top:4px;text-align:right;"></div>
    </div>

    <!-- SteamCMD Dir -->
    <div class="card">
      <div class="card-title">SteamCMD Directory</div>
      <div class="form-group">
        <input type="text" id="cfg-dir" placeholder=". (current dir)">
      </div>
      <button class="btn-ghost btn-sm" style="margin-top:8px;width:100%;" onclick="saveConfig()">Set Directory</button>
      <div id="cfg-msg"></div>
    </div>

    <!-- Login -->
    <div class="card">
      <div class="card-title">Login</div>
      <button class="btn-primary btn-full" id="btn-login" onclick="doLogin()">Login with Active Account</button>
      <div class="sg-panel" id="sg-panel" style="display:none;">
        <div class="sg-label">Steam Guard code required</div>
        <div class="row">
          <input type="text" id="sg-code" placeholder="XXXXX" maxlength="12"
            style="font-family:monospace;text-transform:uppercase;letter-spacing:2px;">
          <button class="btn-primary btn-sm" onclick="doLoginGuard()">OK</button>
        </div>
      </div>
      <div id="login-msg"></div>
    </div>

  </div>

  <!-- Main content -->
  <div class="main-content">

    <div class="tabs">
      <button class="tab active" onclick="switchTab('accounts',this)">Accounts</button>
      <button class="tab" onclick="switchTab('server',this)">Server</button>
      <button class="tab" onclick="switchTab('mods',this)">Mods</button>
    </div>

    <!-- Accounts -->
    <div class="tab-panel active" id="tab-accounts">
      <div class="section-title">Steam Accounts</div>

      <div class="card">
        <div class="card-title">Add Account</div>
        <div class="row">
          <div class="form-group" style="flex:1">
            <label>Username</label>
            <input type="text" id="new-user" placeholder="Steam login">
          </div>
          <div class="form-group" style="flex:1">
            <label>Password</label>
            <input type="password" id="new-pass" placeholder="Password">
          </div>
          <button class="btn-primary" onclick="addUser()">Add</button>
        </div>
        <div id="add-user-msg"></div>
      </div>

      <div class="card mt-16">
        <div class="card-title">Accounts</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th><th>Username</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr><td colspan="4" style="color:var(--muted)">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Server -->
    <div class="tab-panel" id="tab-server">
      <div class="section-title">ArmA 3 Server</div>
      <div class="card">
        <div class="card-title">Install / Update Server</div>
        <div class="form-group" style="margin-bottom:12px;">
          <label>Installation Path</label>
          <input type="text" id="server-path" placeholder="C:\arma3server">
        </div>
        <button class="btn-primary" onclick="updateServer()">Install / Update</button>
        <div id="server-msg"></div>
      </div>
    </div>

    <!-- Mods -->
    <div class="tab-panel" id="tab-mods">
      <div class="section-title">Workshop Mods</div>

      <div class="card">
        <div class="card-title">Install / Update Mods</div>
        <div class="form-group" style="margin-bottom:12px;">
          <label>Workshop IDs — one per line</label>
          <textarea id="mod-ids" placeholder="450814997&#10;463939057"></textarea>
        </div>
        <button class="btn-primary" onclick="updateMods()">Install / Update</button>
        <div id="mods-msg"></div>
      </div>

      <div class="card mt-16">
        <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
          <span>Installed Mods</span>
          <button class="btn-ghost btn-sm" onclick="loadMods()">Refresh</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Path</th></tr></thead>
            <tbody id="mods-tbody">
              <tr><td colspan="2" style="color:var(--muted)">Click Refresh to load</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const STATUS_LABELS = {
  '':                      'Idle',
  'STEAMCMD_INSTALLING':   'Installing SteamCMD',
  'A3SERVER_INSTALLING':   'Installing Server',
  'VALIDATE_MODS':         'Installing Mods',
  'VALIDATE_MODS_ERROR':   'Mod Install Error',
  'STEAM_GUARD_CODE':      'Steam Guard Required',
  'INVALID_USER':          'Invalid Credentials',
  'RATE_LIMIT':            'Rate Limited',
  'STEAMCMD_INIT_ERR':     'Init Error',
  'ERROR_DOWNLOAD_STEAMCMD': 'Download Error',
  'CANT_OPEN_INSTALLER':   'Installer Error',
  'CANT_WRITE_INSTALLER':  'Write Error',
  'MISSING_PARAMS':        'Missing Parameters',
};
const ERROR_STATUSES = new Set([
  'VALIDATE_MODS_ERROR','INVALID_USER','RATE_LIMIT','STEAMCMD_INIT_ERR',
  'ERROR_DOWNLOAD_STEAMCMD','CANT_OPEN_INSTALLER','CANT_WRITE_INSTALLER','MISSING_PARAMS'
]);
const BUSY_STATUSES = new Set([
  'STEAMCMD_INSTALLING','A3SERVER_INSTALLING','VALIDATE_MODS'
]);

function updateStatusUI(data) {
  const label = STATUS_LABELS[data.status] ?? (data.status || 'Idle');
  const dot    = document.getElementById('status-dot');
  const pct    = Math.min(100, data.progress || 0);

  document.getElementById('header-status').textContent = label;
  document.getElementById('header-detail').textContent = data.statusDetails || '';
  document.getElementById('status-label').textContent  = label;
  document.getElementById('status-detail-text').textContent = data.statusDetails || '';
  document.getElementById('progress-fill').style.width     = pct + '%';
  document.getElementById('sidebar-progress').style.width  = pct + '%';
  document.getElementById('progress-text').textContent     = pct > 0 ? pct.toFixed(1) + '%' : '';

  dot.className = 'status-dot';
  if (ERROR_STATUSES.has(data.status))   dot.classList.add('error');
  else if (BUSY_STATUSES.has(data.status)) dot.classList.add('busy');
  else dot.classList.add('idle');
}

// SSE
function connectSSE() {
  const es = new EventSource('/api/events');
  es.onmessage = e => updateStatusUI(JSON.parse(e.data));
  es.onerror = () => { es.close(); setTimeout(connectSSE, 3000); };
}

// Tabs
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'accounts') loadUsers();
  if (name === 'mods') loadMods();
}

// Config
async function loadConfig() {
  const res = await fetch('/api/config');
  if (!res.ok) return;
  const data = await res.json();
  document.getElementById('cfg-dir').value = data.steamCmdDir || '';
}

async function saveConfig() {
  const dir = document.getElementById('cfg-dir').value.trim();
  const res = await fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({steamCmdDir: dir})
  });
  const data = await res.json();
  showMsg('cfg-msg', res.ok ? 'ok' : 'err', res.ok ? 'Saved' : (data.error || 'Error'));
}

// Users
let activeUserId = -1;

async function loadUsers() {
  const res = await fetch('/api/users');
  if (!res.ok) return;
  const {users, activeUserId: aid} = await res.json();
  activeUserId = aid;

  const tbody = document.getElementById('users-tbody');
  if (!users || users.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="color:var(--muted)">No accounts added</td></tr>';
    return;
  }
  tbody.innerHTML = users.map(u => `
    <tr>
      <td style="color:var(--muted)">${u.userId}</td>
      <td>${u.username}</td>
      <td>${u.userId === aid ? '<span class="badge badge-active">Active</span>' : ''}</td>
      <td style="display:flex;gap:6px;">
        ${u.userId !== aid ? `<button class="btn-primary btn-sm" onclick="activateUser(${u.userId})">Activate</button>` : ''}
        <button class="btn-danger btn-sm" onclick="deleteUser(${u.userId})">Delete</button>
      </td>
    </tr>
  `).join('');
}

async function addUser() {
  const u = document.getElementById('new-user').value.trim();
  const p = document.getElementById('new-pass').value;
  if (!u || !p) { showMsg('add-user-msg','err','Username and password required'); return; }
  const res = await fetch('/api/users', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username: u, password: p})
  });
  const data = await res.json();
  if (!res.ok) { showMsg('add-user-msg','err', data.error); return; }
  showMsg('add-user-msg','ok', `Account added (ID: ${data.id})`);
  document.getElementById('new-user').value = '';
  document.getElementById('new-pass').value = '';
  loadUsers();
}

async function deleteUser(id) {
  if (!confirm('Delete this account?')) return;
  await fetch(`/api/users/${id}`, {method:'DELETE'});
  loadUsers();
}

async function activateUser(id) {
  await fetch(`/api/users/${id}/activate`, {method:'POST'});
  loadUsers();
}

// Login
async function doLogin() {
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  document.getElementById('sg-panel').style.display = 'none';
  clearMsg('login-msg');

  const res = await fetch('/api/login', {method:'POST'});
  const data = await res.json();
  btn.disabled = false;

  if (res.status === 401 && data.error === 'STEAM_GUARD_CODE') {
    document.getElementById('sg-panel').style.display = 'block';
    document.getElementById('sg-code').focus();
    showMsg('login-msg','err','Enter Steam Guard code below');
    return;
  }
  if (res.status === 409) { showMsg('login-msg','err','SteamCMD is busy'); return; }
  if (!res.ok) { showMsg('login-msg','err', data.error || 'Login failed'); return; }
  showMsg('login-msg','ok','Logged in successfully');
}

async function doLoginGuard() {
  const code = document.getElementById('sg-code').value.trim().toUpperCase();
  if (!code) return;
  const res = await fetch('/api/login/guard', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({code})
  });
  const data = await res.json();
  if (!res.ok) { showMsg('login-msg','err', data.error || 'Failed'); return; }
  document.getElementById('sg-panel').style.display = 'none';
  document.getElementById('sg-code').value = '';
  showMsg('login-msg','ok','Logged in successfully');
}

// Server
async function updateServer() {
  const path = document.getElementById('server-path').value.trim();
  if (!path) { showMsg('server-msg','err','Path required'); return; }
  const res = await fetch('/api/server/update', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({path})
  });
  const data = await res.json();
  if (!res.ok) { showMsg('server-msg','err', res.status === 409 ? 'SteamCMD is busy' : data.error); return; }
  showMsg('server-msg','ok','Server update started — watch the status bar');
}

// Mods
async function loadMods() {
  const res = await fetch('/api/mods');
  if (!res.ok) return;
  const mods = await res.json();
  const tbody = document.getElementById('mods-tbody');
  if (!mods || mods.length === 0) {
    tbody.innerHTML = '<tr><td colspan="2" style="color:var(--muted)">No mods installed</td></tr>';
    return;
  }
  tbody.innerHTML = mods.map(m => `
    <tr>
      <td><code>${m.id}</code></td>
      <td style="color:var(--muted);font-family:monospace;font-size:12px;">${m.path}</td>
    </tr>
  `).join('');
}

async function updateMods() {
  const raw = document.getElementById('mod-ids').value.trim();
  const ids = raw.split('\n').map(s => s.trim()).filter(Boolean);
  if (!ids.length) { showMsg('mods-msg','err','Enter at least one mod ID'); return; }
  const res = await fetch('/api/mods/update', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ids})
  });
  const data = await res.json();
  if (!res.ok) { showMsg('mods-msg','err', res.status === 409 ? 'SteamCMD is busy' : data.error); return; }
  showMsg('mods-msg','ok','Mod update started — watch the status bar');
}

// Helpers
function showMsg(id, type, text) {
  const el = document.getElementById(id);
  el.innerHTML = `<div class="msg msg-${type}">${text}</div>`;
  setTimeout(() => { el.innerHTML = ''; }, 5000);
}
function clearMsg(id) { document.getElementById(id).innerHTML = ''; }

// Init
connectSSE();
loadConfig();
loadUsers();
</script>
</body>
</html>
